<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IELTS Speaking Test Bench - Logs</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/logs.css">
</head>
<body>
  <header>
    <h1>IELTS Speaking <span>logs</span></h1>
    <div class="head-right">
      <span id="live-pill" class="pill off">no test yet</span>
      <a class="logs-link" href="/" target="speaking-test">Test window &#8599;</a>
    </div>
  </header>

  <main class="logs-grid">
    <section class="panel">
      <div class="t-head"><h2>Run log</h2><span class="muted" id="rl-count"></span></div>
      <div class="bar">
        <select id="runs"><option value="live">Live: this test</option></select>
        <button id="runs-refresh" title="Reload the list of saved runs">Refresh</button>
        <label><input type="checkbox" id="rl-noise" checked> ignored noise</label>
        <label><input type="checkbox" id="rl-lat" checked> reply delays</label>
        <label><input type="checkbox" id="rl-follow" checked> follow</label>
      </div>
      <div id="runlog-sum" class="sum"></div>
      <div id="runlog" class="rows"></div>
    </section>

    <section class="panel">
      <div class="t-head"><h2>Server log</h2><span class="muted" id="sl-info"></span></div>
      <div class="bar">
        <select id="sl-name">
          <option value="web">Test server (web)</option>
          <option value="vllm">LLM (vLLM)</option>
          <option value="setup">Setup</option>
        </select>
        <input id="sl-filter" type="search" placeholder="filter, e.g. error">
        <label><input type="checkbox" id="sl-nodebug" checked> hide debug</label>
        <label><input type="checkbox" id="sl-follow" checked> follow</label>
        <button id="sl-refresh">Refresh</button>
      </div>
      <pre id="sl-view" class="serverlog"></pre>
    </section>
  </main>
  <script src="/static/logs.js"></script>
</body>
</html>
