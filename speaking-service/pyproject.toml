[project]
name = "speaking-service"
version = "0.1.0"
description = "Fully local IELTS Speaking test service (STT + LLM + TTS on GPU)"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.optional-dependencies]
# Heavy runtime deps are installed on the GPU box only. Versions get pinned after the first benchmark.
worker = ["pipecat-ai", "faster-whisper", "kokoro-onnx", "openai"]
control = ["fastapi", "uvicorn", "httpx", "sqlalchemy", "redis", "celery"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
